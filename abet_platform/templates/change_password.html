{% extends 'base.html' %}
{% block title %}Change password · {{ config.PRODUCT_NAME }}{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">Account security</p><h1>Change password</h1><p class="muted">Changing your password signs out the current session.</p></div></div>
<section class="panel auth-card"><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="12" autocomplete="new-password" required><small>At least 12 characters</small></label><label>Confirm new password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label><button class="button primary">Change password</button></form></section>
{% endblock %}
