<div class="matched-plot" tabindex="0" role="region" aria-label="Matched cell comparison on a 0 to 100 percent scale"><div class="matched-row matched-axis"><span>Assessment cell</span><div class="matched-axis-scale"><span>0%</span><span>50%</span><span>100%</span></div><span>Edinburg / Brownsville</span></div>{% for cell in matched.cells %}<div class="matched-row"><div><strong>{{ cell.course.split(' — ')[0] }} · {{ cell.indicator }}</strong><small>{{ cell.term }} · {{ cell.bloom }}</small></div><div class="matched-track"><i class="matched-edinburg" style="left:{{ cell.edinburg }}%" title="Edinburg {{ cell.edinburg|round(1) }}%"></i><i class="matched-brownsville" style="left:{{ cell.brownsville }}%" title="Brownsville {{ cell.brownsville|round(1) }}%"></i></div><span>{{ cell.edinburg|round(1) }}% / {{ cell.brownsville|round(1) }}%</span></div>{% endfor %}</div>
